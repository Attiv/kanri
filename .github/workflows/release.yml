name: "Create Release"

# 两种触发方式：
#   1. 推 tag（app-v0.8.2）—— 版本号取自 src-tauri/tauri.conf.json
#   2. 手动在 Actions 页面点 "Run workflow"（不用先打 tag，action 会自己建）
on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-macos:
    name: macOS ${{ matrix.label }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      # 两个 job 都往同一个 release 追加资产，串行执行避免并发创建 release 时撞车
      max-parallel: 1
      matrix:
        include:
          - label: "Apple Silicon (aarch64)"
            args: "--target aarch64-apple-darwin"
          - label: "Intel (x86_64)"
            args: "--target x86_64-apple-darwin"

    steps:
      - uses: actions/checkout@v5

      # 版本号从 package.json 的 packageManager 字段读（pnpm@11.9.0），不要另外写 version，
      # 否则 action 会报 "Multiple versions of pnpm specified"
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.args }}

      - name: install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri.conf.json 里没有 beforeBuildCommand，前端必须在这里先构建好
      - name: Build frontend
        run: pnpm generate

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 没有 Apple 开发者证书，用 ad-hoc 签名（"-"）——Apple Silicon 上不签名根本无法启动
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: app-v__VERSION__
          releaseName: "Kanri v__VERSION__"
          releaseBody: |
            macOS 版本：Apple Silicon（M 系列）与 Intel 各一个 `.dmg`。

            **未做公证（unsigned + ad-hoc 签名）**，首次打开会被 Gatekeeper 拦。

            如果提示"已损坏，无法打开"，在终端执行：

            ```bash
            xattr -dr com.apple.quarantine /Applications/kanri.app
            ```

            或用 `右键 → 打开` 绕过一次。

            > 安装前请退出正在运行的 Kanri。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
